# Supabase project configuration for Optimus Detection Studio.
# Docs: https://supabase.com/docs/guides/local-development/cli/config
#
# This file lets `supabase link`, `supabase db push`, `supabase functions deploy`,
# and `supabase start` (local Docker stack) work for anyone who forks the repo.
# `project_id` is a LOCAL label only — you link to YOUR OWN project with:
#   supabase link --project-ref <your-project-ref>

project_id = "optimus-detection-studio"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Must match your remote Postgres major version (this project targets Postgres 17).
major_version = 17

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
enabled = true
# For a fork: set to your deployed app URL (or keep localhost for local dev).
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

# ─────────────────────────────────────────────────────────────────────────────
# Edge Functions (19). verify_jwt=true means Supabase's gateway requires a valid
# JWT before the function runs (a user JWT or the service-role key both satisfy
# it). Only `demo-request` is fully public (it is called from the landing page
# before sign-in).
# ─────────────────────────────────────────────────────────────────────────────

[functions.demo-request]
verify_jwt = false

[functions.ai-generate]
verify_jwt = true

[functions.optimus-tools]
verify_jwt = true

[functions.generate-embedding]
verify_jwt = true

[functions.batch-embedding]
verify_jwt = true

[functions.manage-users]
verify_jwt = true

[functions.integration-ops]
verify_jwt = true

[functions.review-ops]
verify_jwt = true

[functions.audit-log]
verify_jwt = true

[functions.run-playbook]
verify_jwt = true

[functions.detection-finetune]
verify_jwt = true

[functions.threat-intel-digest-v2]
verify_jwt = true

[functions.fetch-feeds]
verify_jwt = true

[functions.enrich-threat-groups]
verify_jwt = true

[functions.auto-digest-orchestrator]
verify_jwt = true

[functions.auto-digest-dry-link]
verify_jwt = true

[functions.trigger-auto-digest]
verify_jwt = true

[functions.auto-digest-queue-consumer]
verify_jwt = true

[functions.threat-research-orchestrator]
verify_jwt = true

[functions.pack-deploy-worker]

[functions.manage-threat-intel-feed]
verify_jwt = true
