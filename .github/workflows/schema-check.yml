name: schema-check

# Proves that supabase/schema.sql applies cleanly to a BRAND-NEW EMPTY database
# (i.e. a fresh fork can stand up the backend from zero). Runs on any change to
# the schema. Uses a plain Postgres 17 + pgvector image and stubs only the
# Supabase-managed bits (auth schema/roles/helpers) that a real Supabase project
# already provides.

on:
  push:
    paths:
      - 'supabase/schema.sql'
      # Migrations too. Triggering only on schema.sql meant the one mistake this
      # guard exists to catch — a migration that forgets to mirror into
      # schema.sql — was also the one case that never ran it. Fresh installs
      # apply schema.sql, so an unmirrored migration silently diverges prod from
      # a new clone.
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'scripts/setup.ts'
      - 'scripts/setup-*.ts'
      - 'scripts/setup-migrations.json'
      - 'scripts/setup-check.ts'
      - '.github/workflows/schema-check.yml'
  pull_request:
    paths:
      - 'supabase/schema.sql'
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'scripts/setup.ts'
      - 'scripts/setup-*.ts'
      - 'scripts/setup-migrations.json'
      - 'scripts/setup-check.ts'
      - '.github/workflows/schema-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply-on-empty-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # postgres:// scheme (libpq accepts it) — throwaway local CI database.
      PGURL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          # The upgrade check reads a historical supabase/schema.sql out of git.
          fetch-depth: 0

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Stub the Supabase-managed environment (auth, roles, realtime)
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 <<'SQL'
          -- Roles that Supabase provisions on every project
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin;
          -- Minimal auth surface the schema references
          create schema if not exists auth;
          create table if not exists auth.users (id uuid primary key default gen_random_uuid(), email text,
            raw_user_meta_data jsonb default '{}', raw_app_meta_data jsonb default '{}');
          create or replace function auth.uid() returns uuid language sql stable as $$
            select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid
          $$;
          grant usage on schema auth to authenticated, service_role;
          create or replace function auth.jwt()  returns jsonb language sql stable as $$ select null::jsonb $$;
          create or replace function auth.role() returns text  language sql stable as $$ select null::text  $$;
          -- Realtime publication that the schema adds tables to
          create publication supabase_realtime;
          SQL

      - name: Apply supabase/schema.sql on the EMPTY database
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/schema.sql

      - name: Assert the schema materialised correctly
        run: |
          fail=0
          T=$(psql "$PGURL" -tA -c "select count(*) from information_schema.tables where table_schema='public' and table_type='BASE TABLE';")
          F=$(psql "$PGURL" -tA -c "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public';")
          P=$(psql "$PGURL" -tA -c "select count(*) from pg_policies where schemaname='public';")
          R=$(psql "$PGURL" -tA -c "select count(*) from pg_publication_tables where pubname='supabase_realtime';")
          A=$(psql "$PGURL" -tA -c "select count(*) from pg_trigger where tgname='on_auth_user_created';")
          C=$(psql "$PGURL" -tA -c "select count(*) from information_schema.columns where table_schema='public' and table_name='auto_digest_jobs' and column_name in ('active_entry_id','heartbeat_at');")
          # Watchdog must be the durable-queue version. This used to look for
          # 'active_entry_id' and 'digest_failed', which the durable-queue
          # rebuild deliberately removed when per-article state moved out of
          # auto_digest_jobs and into leased auto_digest_job_entries rows. The
          # assertion outlived the design it guarded and failed against both
          # schema.sql and production, so it now checks the markers the current
          # watchdog actually has: it must reclaim expired entry leases and
          # judge job liveness by heartbeat.
          W=$(psql "$PGURL" -tA -c "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.oid='public.auto_digest_watchdog()'::regprocedure and pg_get_functiondef(p.oid) like '%auto_digest_job_entries%' and pg_get_functiondef(p.oid) like '%lease_expires_at%' and pg_get_functiondef(p.oid) like '%heartbeat_at%';")
          echo "public tables:        $T (expect >= 63)"
          echo "public functions:     $F (expect >= 80)"
          echo "public RLS policies:  $P (expect >= 170)"
          echo "realtime tables:      $R (expect 8)"
          echo "auth signup trigger:  $A (expect 1)"
          echo "auto-digest columns:  $C (expect 2)"
          echo "watchdog definition:  $W (expect 1)"
          [ "$T" -ge 63 ] || { echo "::error::expected at least 63 tables, got $T"; fail=1; }
          [ "$P" -ge 170 ] || { echo "::error::expected at least 170 policies, got $P"; fail=1; }
          [ "$R" -eq 8 ]  || { echo "::error::expected 8 realtime tables, got $R"; fail=1; }
          [ "$A" -eq 1 ]  || { echo "::error::expected on_auth_user_created trigger, got $A"; fail=1; }
          [ "$C" -eq 2 ]  || { echo "::error::expected active_entry_id and heartbeat_at, got $C"; fail=1; }
          [ "$W" -eq 1 ]  || { echo "::error::expected heartbeat-aware auto_digest_watchdog, got $W"; fail=1; }

          # No SECURITY DEFINER function in public may be reachable by anon.
          #
          # This is not hypothetical. Changing tr_consume_budget's signature
          # required DROP + CREATE; DROP discards the function's ACL, and
          # Supabase default privileges then re-granted EXECUTE to PUBLIC, anon
          # and authenticated -- silently undoing lock_down_rpc_execute for that
          # function and exposing a SECURITY DEFINER budget mutator through
          # /rest/v1/rpc with no caller validation.
          #
          # Nothing caught it: it is invisible to tsc, to vitest, and to a
          # schema diff, because the function body was correct. Only the grant
          # was wrong. So the assertion belongs here, against a real database.
          # SCOPE LIMIT, recorded so it is not mistaken for broader coverage:
          # this catches FUNCTION grants because PostgreSQL itself grants
          # EXECUTE to PUBLIC on CREATE FUNCTION, so the failure reproduces on a
          # plain Postgres image.
          #
          # It does NOT catch TABLE grants. Plain PostgreSQL grants nothing to
          # other roles on CREATE TABLE; the equivalent table leak comes from
          # Supabase's ALTER DEFAULT PRIVILEGES, which only exists in a real
          # project. threat_research_vendor_searches shipped revoking PUBLIC and
          # anon but not authenticated, which left INSERT/UPDATE/DELETE/TRUNCATE
          # in place -- RLS denied the first three, and TRUNCATE is not subject
          # to RLS. A CI assertion here would have passed.
          #
          # So: after any CREATE TABLE, verify grants against the LIVE catalog.
          # Adding a green check here for that class would be false comfort.
          S=$(psql "$PGURL" -tA -c "select coalesce(string_agg(p.oid::regprocedure::text, ', '), '') from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.prosecdef and has_function_privilege('anon', p.oid, 'EXECUTE');")
          if [ -n "$S" ]; then
            echo "::error::SECURITY DEFINER function(s) executable by anon: $S"
            fail=1
          else
            echo "anon-executable SECURITY DEFINER functions: none ✅"
          fi

          # A column DEFAULT that its own CHECK constraint rejects makes every
          # INSERT omitting that column fail outright. It is invisible until
          # someone writes the first such INSERT, and then it looks like a bug
          # in the writer rather than in the schema.
          #
          # Not hypothetical: auto_digest_job_entries.phase defaulted to
          # 'digesting' while its CHECK allowed only 'digest'. The auto-digest
          # orchestrator only worked because it passed phase explicitly, and
          # the restored digesting phase had to keep doing so.
          #
          # KNOWN DEBT, excluded below so this gates rather than fails on day
          # one -- both predate the check and both are live traps in the
          # product's core table:
          #   detections.library_type      default 'user'        CHECK development|production
          #   detections.promotion_status  default 'unpublished' CHECK none|pending|promoted|rejected
          # Fix those, shrink the exclusion list. Anything NEW fails the build.
          DV=$(psql "$PGURL" -tA <<'SQL'
          select coalesce(string_agg(format('%s.%s (default %s)', c.relname, a.attname,
                                            pg_get_expr(d.adbin, d.adrelid)), ', '), '')
            from pg_attribute a
            join pg_class      c on c.oid = a.attrelid
            join pg_namespace  n on n.oid = c.relnamespace
            join pg_attrdef    d on d.adrelid = a.attrelid and d.adnum = a.attnum
            join pg_constraint k on k.conrelid = a.attrelid
                                and k.contype = 'c'
                                and k.conkey = array[a.attnum]
           where n.nspname = 'public'
             and c.relkind = 'r'
             and a.atttypid = 'text'::regtype
             and pg_get_expr(d.adbin, d.adrelid) ~ '^''[^'']*''::text$'
             and pg_get_constraintdef(k.oid) like '%= ANY (ARRAY[%'
             and pg_get_constraintdef(k.oid) not like
                   '%''' || btrim(split_part(pg_get_expr(d.adbin, d.adrelid), '::', 1), '''') || '''%'
             and format('%s.%s', c.relname, a.attname) not in
                   ('detections.library_type', 'detections.promotion_status');
          SQL
          )
          if [ -n "$DV" ]; then
            echo "::error::column default(s) rejected by their own CHECK constraint: $DV"
            fail=1
          else
            echo "defaults violating their own CHECK: none ✅"
          fi

          [ "$fail" -eq 0 ] && echo "✅ supabase/schema.sql applies cleanly on an empty database"
          exit $fail

      - name: Prove the SIEM migrations and schema.sql agree (upgrade == fresh install)
        # This job applies schema.sql to an empty database, which proves a fresh install stands
        # up. It never applied the migrations -- so the one mistake the schema.sql mirror exists
        # to prevent, a migration whose text drifted from its mirrored copy, was exactly the case
        # nothing ran. Both roads must lead to the same place:
        #   fresh    = empty + supabase/schema.sql                    (already applied above)
        #   upgraded = the schema deployed BEFORE the SIEM work + subsequent SIEM migrations
        # Divergence here means an existing deployment ends up different from a new clone.
        run: |
          set -euo pipefail
          BASE_SHA=$(git log --diff-filter=A --format=%H -1 \
            -- supabase/migrations/20260914153559_native_siem_library.sql)
          if [ -z "$BASE_SHA" ]; then
            echo "::error::could not locate the commit that introduced the first native SIEM migration"
            exit 1
          fi
          echo "pre-SIEM baseline: ${BASE_SHA}^"

          psql "$PGURL" -v ON_ERROR_STOP=1 -tA -f supabase/tests/siem-surface-fingerprint.sql > /tmp/fresh.txt

          psql "$PGURL" -v ON_ERROR_STOP=1 -c 'create database upgrade_check'
          UPGURL="postgres://postgres:postgres@localhost:5432/upgrade_check"
          # Roles are cluster-wide and already exist; only the per-database objects are recreated.
          psql "$UPGURL" -v ON_ERROR_STOP=1 <<'SQL'
          create schema if not exists auth;
          create table if not exists auth.users (id uuid primary key default gen_random_uuid(), email text,
            raw_user_meta_data jsonb default '{}', raw_app_meta_data jsonb default '{}');
          create or replace function auth.uid() returns uuid language sql stable as $$
            select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid
          $$;
          create or replace function auth.jwt()  returns jsonb language sql stable as $$ select null::jsonb $$;
          create or replace function auth.role() returns text  language sql stable as $$ select null::text  $$;
          grant usage on schema auth to authenticated, service_role;
          create publication supabase_realtime;
          SQL

          git show "${BASE_SHA}^:supabase/schema.sql" | psql "$UPGURL" -v ON_ERROR_STOP=1
          for f in supabase/migrations/*.sql; do
            # Include provider-neutral and workflow repairs as well as native_siem files.
            # Earlier unrelated SIEM migrations are already present in the baseline.
            name=$(basename "$f")
            [[ "$name" < "20260914153559_native_siem_library.sql" ]] && continue
            case "$name" in
              *siem*.sql|*native_import_observed_status.sql|*pack_deploy*.sql|*sentinelone_import_format.sql) ;;
              *) continue ;;
            esac
            echo "  applying $(basename "$f")"
            psql "$UPGURL" -v ON_ERROR_STOP=1 -f "$f" > /dev/null
          done
          psql "$UPGURL" -v ON_ERROR_STOP=1 -f supabase/tests/pack-deploy.sql
          psql "$UPGURL" -v ON_ERROR_STOP=1 -tA -f supabase/tests/siem-surface-fingerprint.sql > /tmp/upgraded.txt

          if diff -u /tmp/fresh.txt /tmp/upgraded.txt > /tmp/surface.diff; then
            echo "✅ upgraded database matches a fresh install ($(wc -l < /tmp/fresh.txt) SIEM objects)"
          else
            echo "::error::the SIEM migrations and supabase/schema.sql disagree"
            echo "  '-' lines are what a FRESH install has; '+' lines are what an UPGRADE produces."
            cat /tmp/surface.diff
            exit 1
          fi

      - name: Verify native SIEM identity, transactions, and private snapshot access
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/tests/native-siem.sql

      - name: Verify shared Auto Digest reads and admin-only management
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/tests/team-auto-digest.sql

      - name: Verify Chronicle saves, unsupported connections, and watchdog repair
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/tests/setup-integrations.sql

      - name: Verify atomic Vault and cron configuration without custom database settings
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/tests/setup-automation.sql

      - name: Verify signup roles, invitation boundaries, and browser table privileges
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/tests/oss-authorization.sql

      - name: Verify the installer preserves the watchdog on first run and rerun
        run: |
          psql "$PGURL" -tA -c "select pg_get_functiondef('public.auto_digest_watchdog()'::regprocedure)" > /tmp/watchdog-before.sql
          python3 -c 'import json; print("\n".join(json.load(open("scripts/setup-migrations.json"))))' > /tmp/setup-migrations.txt
          for attempt in 1 2; do
            while IFS= read -r migration; do
              psql "$PGURL" -v ON_ERROR_STOP=1 --single-transaction -f "$migration" > /dev/null
            done < /tmp/setup-migrations.txt
            psql "$PGURL" -tA -c "select pg_get_functiondef('public.auto_digest_watchdog()'::regprocedure)" > /tmp/watchdog-after.sql
            diff -u /tmp/watchdog-before.sql /tmp/watchdog-after.sql
          done

      - name: Verify native SIEM inventory catalog and relationship contract
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/tests/native-siem-inventory.sql

      - name: Verify native SIEM import selection freeze and idempotency
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/tests/native-siem-import.sql

      - name: Verify pack deploy transactions, leases, cancellation and coverage
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/tests/pack-deploy.sql
