name: gitleaks

# Secret-scanning guardrail. Fails the build if a credential is ever committed —
# a permanent backstop to the one-off full-history audit done for the OSS
# release. Runs on every PR and on push to master, and re-sweeps the FULL git
# history weekly. Findings print with file + commit + line; secret values are
# redacted so they never leak into public CI logs.
#
# Uses the pinned gitleaks binary (not gitleaks/gitleaks-action) so it needs no
# license key even if this repo is later moved under a GitHub organization — the
# Action is free only for personal accounts. Allowlisted false positives live in
# .gitleaks.toml at the repo root.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly full-history sweep (Mondays 06:17 UTC) as a drift safety net.
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so gitleaks scans every commit, not just the tip: a
          # secret added and later removed still lives in history.
          fetch-depth: 0

      - name: Install gitleaks (pinned + checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          # sha256 of gitleaks_8.30.1_linux_x64.tar.gz from the official release
          # checksums. Baked in so a tampered release fails rather than running.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Scan git history for secrets
        # `gitleaks git` walks the full history and exits non-zero on any finding.
        run: ./gitleaks git . --config .gitleaks.toml --redact --verbose
