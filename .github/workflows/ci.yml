name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the version that generated bun.lock so --frozen-lockfile
          # validates identically in CI and locally.
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run type-check

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      # Lint gates the build on errors. ESLint exits 0 on warnings-only, so the
      # remaining advisory warnings don't fail CI; any new error does.
      - name: Lint
        run: bun run lint
