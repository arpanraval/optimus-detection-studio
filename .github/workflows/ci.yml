name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the version that generated bun.lock so --frozen-lockfile
          # validates identically in CI and locally.
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run type-check

      - name: Type-check setup scripts
        run: bun run type-check:setup

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      # Lint gates the build on errors. ESLint exits 0 on warnings-only, so the
      # remaining advisory warnings don't fail CI; any new error does.
      - name: Lint
        run: bun run lint

  node25-storage-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '25.3.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - run: bun run test

  # Check every deployed entry point against the Deno runtime. No advisory exclusions.
  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4
      - name: Type-check all Edge Functions
        run: |
          set -uo pipefail
          failed=0
          for entry in supabase/functions/*/index.ts; do
            echo "::group::deno check $entry"
            passed=0
            for attempt in 1 2 3; do
              if deno check --no-lock --node-modules-dir=auto "$entry"; then
                passed=1
                break
              fi
              # Remote module CDNs can fail transiently; deterministic errors fail all attempts.
              [ "$attempt" -eq 3 ] || sleep "$(( attempt * 5 ))"
            done
            if [ "$passed" -ne 1 ]; then
              echo "::error file=$entry::deno check failed"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"
